<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1513" />
    <title>Hors connexion · Thot Stratégie</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0; min-height: 100dvh; display: grid; place-items: center;
        background: #0f1513; color: #e4e9e5;
        font: 16px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        padding: 24px; box-sizing: border-box; text-align: center;
      }
      main { max-width: 360px; }
      img { width: 72px; height: 72px; border-radius: 18px; }
      h1 { font-size: 20px; margin: 20px 0 8px; }
      p { color: #b4bfb9; font-size: 14px; margin: 0 0 24px; }
      button {
        font: inherit; font-weight: 600; font-size: 14px; color: #0d1a14; background: #86c7a8;
        border: 0; border-radius: 12px; padding: 12px 20px; min-height: 44px; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>Vous êtes hors connexion</h1>
      <p>Les parties, la recherche d’adversaire et votre portefeuille ont besoin d’une connexion pour rester justes et à jour. Vérifiez votre réseau puis réessayez.</p>
      <button type="button" onclick="location.reload()">Réessayer</button>
    </main>
  </body>
</html>
